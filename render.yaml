# Render Blueprint — deploy DocuQuery in one click.
# In the Render dashboard: New → Blueprint → point at this repo.
# Secrets are prompted once at creation (sync: false) and stay out of git.
services:
  - type: web
    name: docuquery
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --timeout 180
    healthCheckPath: /api/health
    envVars:
      - key: MAX_UPLOAD_MB
        value: "50"
      - key: GROQ_MODEL
        value: "openai/gpt-oss-20b"
      - key: SUPABASE_STORAGE_PRIMARY
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
